# Canonical label space and per-model native -> canonical mappings.
#
# Every mapping below was derived from the upstream SOURCE, not guessed from integers:
#   * HandHygiene: app/video_thread.py `steps_map` + Example.ipynb `valores_unicos`
#       model classes_ = [1..10]  <->  [1.0, 2.1, 2.2, 3.0, 4.1, 4.2, 5.1, 5.2, 6.1, 6.2]
#       (WHO step number; ".1"/".2" are the two mirror variants of asymmetric steps).
#       The paper/code do NOT state which hand ".1" acts on -> side UNRESOLVED.
#       Class index 10 ("No step") is NOT a model class; it is produced by the upstream
#       0.4 confidence threshold. We represent it as PredictionStatus.UNKNOWN.
#   * S-Kia: step_names = ["1","2lt","2rt","3","4lt","4rt","5lt","5rt","6lt","6rt","7lt","7rt"]
#       = Kaggle realtimear/hand-wash-dataset folders Step_1, Step_2_Left, Step_2_Right, ...
#       Kaggle's "Left"/"Right" semantics (hand acted upon vs. acting) are not documented in
#       the repository -> side UNRESOLVED until verified on the dataset videos
#       (see docs/MODEL_INTEGRATION.md "Resolving side semantics").
#   * YOLO (dpt-xyz): classes 0..6 = Step1..Step7 (README table). Visually verified on the
#       vendored training images (upstream/.../images/train/{c}_40.jpg):
#       0 palm-to-palm, 1 palm over dorsum (back of hand), 2 interlaced fingers,
#       3 backs of fingers interlocked, 4 thumb rubbing, 5 fingertips in palm, 6 wrist rubbing.
#       Step7/wrist is outside the WHO six-technique core -> extension label `wrist_rubbing`.
version: 1
techniques:
  core:
    - palm_to_palm
    - back_of_hand
    - interlaced_fingers
    - backs_of_fingers
    - thumb_rubbing
    - fingertip_rubbing
  special:
    - none
    - unknown
    - transition
  # Extensions never create region evidence for the core regions. Adding one here does
  # not require retraining anything; models that lack the class simply never emit it.
  extensions:
    - wrist_rubbing
# Techniques where one hand acts on the other (side = hand receiving the action).
sided_techniques: [back_of_hand, backs_of_fingers, thumb_rubbing, fingertip_rubbing, wrist_rubbing]
symmetric_techniques: [palm_to_palm, interlaced_fingers]

models:
  handhygiene:
    native_order: ["1", "2.1", "2.2", "3", "4.1", "4.2", "5.1", "5.2", "6.1", "6.2"]
    map:
      "1":   {technique: palm_to_palm,       side: both}
      "2.1": {technique: back_of_hand,       side: unresolved, note: "variant 1 of WHO step 2; acted-upon hand unverified"}
      "2.2": {technique: back_of_hand,       side: unresolved, note: "variant 2 of WHO step 2"}
      "3":   {technique: interlaced_fingers, side: both}
      "4.1": {technique: backs_of_fingers,   side: unresolved}
      "4.2": {technique: backs_of_fingers,   side: unresolved}
      "5.1": {technique: thumb_rubbing,      side: unresolved}
      "5.2": {technique: thumb_rubbing,      side: unresolved}
      "6.1": {technique: fingertip_rubbing,  side: unresolved}
      "6.2": {technique: fingertip_rubbing,  side: unresolved}
  skia:
    native_order: ["1", "2lt", "2rt", "3", "4lt", "4rt", "5lt", "5rt", "6lt", "6rt", "7lt", "7rt"]
    map:
      "1":   {technique: palm_to_palm,       side: both}
      "2lt": {technique: back_of_hand,       side: unresolved, note: "Kaggle Step_2_Left; which hand is on top is unverified"}
      "2rt": {technique: back_of_hand,       side: unresolved, note: "Kaggle Step_2_Right"}
      "3":   {technique: interlaced_fingers, side: both}
      "4lt": {technique: backs_of_fingers,   side: unresolved}
      "4rt": {technique: backs_of_fingers,   side: unresolved}
      "5lt": {technique: thumb_rubbing,      side: unresolved}
      "5rt": {technique: thumb_rubbing,      side: unresolved}
      "6lt": {technique: fingertip_rubbing,  side: unresolved}
      "6rt": {technique: fingertip_rubbing,  side: unresolved}
      "7lt": {technique: wrist_rubbing,      side: unresolved, note: "extension; not a core WHO rubbing technique"}
      "7rt": {technique: wrist_rubbing,      side: unresolved}
  # temporal_v2 (detection/pair_adapter.py): trained on technique names directly; no left/right in the
  # labels (Kaggle sides merged, METC has none), so sided techniques stay `unresolved`. `none` = not washing.
  temporal_v2:
    native_order: [palm_to_palm, back_of_hand, interlaced_fingers, backs_of_fingers, thumb_rubbing, fingertip_rubbing, wrist_rubbing, none]
    map:
      palm_to_palm:       {technique: palm_to_palm,       side: both}
      back_of_hand:       {technique: back_of_hand,       side: unresolved}
      interlaced_fingers: {technique: interlaced_fingers, side: both}
      backs_of_fingers:   {technique: backs_of_fingers,   side: unresolved}
      thumb_rubbing:      {technique: thumb_rubbing,      side: unresolved}
      fingertip_rubbing:  {technique: fingertip_rubbing,  side: unresolved}
      wrist_rubbing:      {technique: wrist_rubbing,      side: unresolved, note: "extension"}
      none:               {technique: none,               side: unknown, note: "not washing (METC 'other', own idle clips)"}
  yolo:
    native_order: ["Step1", "Step2", "Step3", "Step4", "Step5", "Step6", "Step7"]
    map:
      "Step1": {technique: palm_to_palm,       side: both}
      "Step2": {technique: back_of_hand,       side: unknown, note: "no side information in the 7-class scheme"}
      "Step3": {technique: interlaced_fingers, side: both}
      "Step4": {technique: backs_of_fingers,   side: unknown}
      "Step5": {technique: thumb_rubbing,      side: unknown}
      "Step6": {technique: fingertip_rubbing,  side: unknown}
      "Step7": {technique: wrist_rubbing,      side: unknown, note: "extension"}

# Human-verified side resolution. Keys are "<model>:<native_label>", values are left|right =
# the hand RECEIVING the action (the static hand: the one whose back / thumb / wrist is rubbed, or
# whose palm hosts the other hand's fingertips).
#
# Verified 2026-11-14 by viewing mid-clip frames of 4 sessions per folder (001, 009, 017, 024) of
# the Kaggle set (overhead camera, person at the bottom of the frame, so image-left = person's left):
#   Step_2_Left  right palm rubs the back of the LEFT hand          -> left receives
#   Step_4_Left  LEFT fingers' backs in the right palm, interlocked -> left receives
#   Step_5_Left  right hand clasps the LEFT thumb                   -> left receives
#   Step_6_Left  right fingertips rub in the LEFT palm              -> left receives (fingertips cleaned are the RIGHT hand's)
#   Step_7_Left  right hand grips the LEFT wrist                    -> left receives
#   *_Right mirrors each of these. HandHygiene's ".1/.2" variants are not documented upstream and
#   that model has fusion weight 0, so they stay unresolved.
# temporal_v2 has no sides in its labels; its events get a side from detection/side_resolver.py
# (a geometry model trained on these same clips, 96.5 % held-out frame accuracy).
side_resolution:
  "skia:2lt": left
  "skia:2rt": right
  "skia:4lt": left
  "skia:4rt": right
  "skia:5lt": left
  "skia:5rt": right
  "skia:6lt": left
  "skia:6rt": right
  "skia:7lt": left
  "skia:7rt": right
