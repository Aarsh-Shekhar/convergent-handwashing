# Default laptop development configuration. Secrets live in .env (see .env.example).
source:
  kind: synthetic          # video | webcam | network | synthetic (overridden by CLI commands)
  width: 640
  height: 480
  target_fps: 15.0         # engineering starting point, not a guaranteed hardware rate
  rotation_deg: 0
tracker:
  backend: auto            # tasks (needs models/mediapipe/hand_landmarker.task) | solutions (bundled) | null
  num_hands: 2
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  model_complexity: 1
  swap_handedness: true    # faucet camera image is NOT mirrored -> swap MediaPipe's selfie-convention label
handhygiene:
  enabled: true
  model_path: models/handhygiene/rf_10102024.numpy-forest.npz   # validated conversion of upstream RF (sklearn 1.0.2)
  unknown_threshold: 0.4
  feed_mode: raw_label     # reproduce the upstream slot convention exactly
skia:
  enabled: true
  mode: temporal           # temporal | legacy (needs TensorFlow extra) | both
  temporal_artifact_dir: models/skia_temporal/current
  window_frames: 16
  max_gap_s: 0.25
  unknown_threshold: 0.4
yolo:
  enabled: true
  weights_path: models/yolo/handwash_yolov5.pt
  every_n_frames: 3
  conf_threshold: 0.25
temporal_v2:               # hand-relative temporal model (7 techniques + "none"); see docs/MODEL_INTEGRATION.md
  enabled: true
  artifact_dir: models/temporal_v2/current
  unknown_threshold: 0.4
  smooth_s: 0.0            # probability smoothing time constant (s); 0 = off. Off since 2026-11-12: saves ~0.35 s of lag, label changes/min 25 -> 60 on own round down3
  hold_s: 0.35             # keep answering through tracking dropouts up to this long
side_resolver:             # which hand receives a sided technique (detection/side_resolver.py); artifact trained on Kaggle, see docs/TEST_RESULTS.md section 9
  enabled: true
  artifact_dir: models/side_resolver/current
  mirrored: false          # set true when the camera faces the user (image-left = user's right hand)
  min_frames: 6
  margin: 0.15
fusion:
  method: reliability_weighted
  # Weights re-derived 2026-11-11 on held-out METC subjects through the full pipeline
  # (scripts/benchmark_recognition.py --metc data/METC, docs/TEST_RESULTS.md section 7):
  #   temporal_v2 alone      frame acc 0.75, credited/performed 0.70, 24 label changes/min
  #   all branches fused     frame acc 0.38, credited/performed 0.14, 65 label changes/min
  #   v1 branches only       frame acc 0.22, credited/performed 0.07, 248 label changes/min
  # so the v1 branches (handhygiene 0.21, skia_temporal 0.25 frame accuracy) get weight 0: they still
  # run and are logged, but do not vote. yolo has no weights. Re-check on OUR camera recordings.
  weights: {temporal_v2: 1.0, handhygiene: 0.0, skia_temporal: 0.0, skia_legacy: 0.0, yolo: 0.5}
  unknown_threshold: 0.45
  contradiction_margin: 0.15
  alignment_tolerance_s: 0.25
  max_prediction_age_s: 0.6
temporal:
  enter_confidence: 0.6
  exit_confidence: 0.4
  min_duration_s: 0.5      # 1.0 until 2026-11-12; 0.5 makes step timers start 0.5 s sooner (wrong credit +0.07 s per 10 s on METC)
  max_gap_s: 0.5
  min_tracking_quality: 0.3
  merge_gap_s: 0.75
  duplicate_window_s: 1.0
regions:
  min_sufficient_duration_s: 3.0
  partial_visibility_weight: 0.5
  use_unresolved_side_evidence: false
scoring:                   # wash score (technique-level, either hand). First guesses: tune on real washes.
  steps: [palm_to_palm, back_of_hand, interlaced_fingers, backs_of_fingers, thumb_rubbing, fingertip_rubbing, wrist_rubbing]
  step_min_s: 3.0          # validated seconds per step, summed across tries
  steps_required: 5        # finished = this many steps done ...
  total_min_s: 20.0        # ... AND this much total validated washing time
  step_points: 10
  time_points: 30
  two_star_steps: 3
  two_star_total_s: 10.0
  backfill_s: 1.5          # on validation, credit up to 1.5 s of unrecognized time just before the step (model lag, median 1.4 s)
projector:
  logical_width: 854
  logical_height: 480
  profile_path: models/calibration/active_profile.json
  anchors: [hand_centroid, fingertips]
  smoothing: {method: one_euro, one_euro_min_cutoff: 1.5, one_euro_beta: 0.05, reset_gap_s: 0.5, max_prediction_horizon_s: 0.1}
backend:
  enabled: false
  base_url: http://127.0.0.1:8000
  batch_size: 32
queue_size: 4
device_id: laptop-dev
results_dir: runs
